[project]
name = "notebooklm-auto-pipeline"
version = "0.1.0"
description = "NotebookLM 자동화 파이프라인 — URL 입력 → AI 재요약 → 인포그래픽 생성 → 전달"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "platformdirs>=4.0",
    "websocket-client>=1.6.0",
]

[project.optional-dependencies]
slack = ["slack-sdk>=3.27.0"]
email = ["aiosmtplib>=3.0.0"]
webhook = ["fastapi>=0.115.0", "uvicorn>=0.32.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24.0"]
all = [
    "notebooklm-auto-pipeline[slack,email,webhook,dev]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline", "src/notebooklm_tools"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
