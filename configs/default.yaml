# NotebookLM 자동화 파이프라인 기본 설정

# 대상 노트북 (nlm notebook list로 확인)
notebook_id: ""

# --- 소스 추가 ---
source:
  wait: true             # 소스 처리 완료까지 대기
  wait_timeout: 300      # 대기 타임아웃 (초)

# --- AI 요약 ---
summary:
  prompt: "이 내용의 핵심을 3가지로 요약하고 시사점을 도출해줘"
  use_as_focus: true     # 요약 결과를 인포그래픽 focus_prompt로 활용
  max_focus_length: 500  # focus_prompt 최대 길이

# --- 인포그래픽 생성 ---
infographic:
  orientation: landscape       # landscape | portrait | square
  detail_level: detailed       # concise | standard | detailed
  style: professional          # 11종 스타일 옵션
  language: ko
  focus_prompt: ""             # 비어있으면 summary 결과 사용

# --- 폴링 ---
poller:
  interval: 10           # 폴링 간격 (초)
  max_wait: 300          # 최대 대기 시간 (초)

# --- 다운로드 ---
download:
  output_dir: ./output
  filename_template: "infographic_{timestamp}.png"

# --- 전달 ---
delivery:
  method: file           # file | slack | email
  # Slack 설정 (method: slack일 때)
  slack:
    token: ""
    channel: ""
  # Email 설정 (method: email일 때)
  email:
    smtp_host: ""
    smtp_port: 587
    username: ""
    password: ""
    to: ""
    subject: "NotebookLM 인포그래픽 자동 생성 결과"

# --- 트리거 ---
trigger:
  method: manual         # manual | cron | webhook | watch
  # Cron 설정 (method: cron일 때)
  cron:
    schedule: "0 9 * * 1-5"   # 평일 오전 9시
  # Webhook 설정 (method: webhook일 때)
  webhook:
    host: "0.0.0.0"
    port: 8080
    path: "/trigger"
  # 파일 감시 설정 (method: watch일 때)
  watch:
    directory: ./watch
    pattern: "*.txt"
